# Roda a cada push e pull request: contraste, ponta a ponta nos dois motores de
# celular (WebKit, o do Safari, e Chromium, o do Chrome e do Brave), o app com o
# SDK de verdade contra os emuladores e as regras do Firestore no emulador. Nada
# aqui toca o projeto real do Firebase: o e2e usa o stub, e o resto roda num
# projeto "demo-", que so existe nos emuladores.
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: contraste e ponta a ponta (webkit e chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/contraste.py
      - run: python tests/e2e.py --motor chromium,webkit --saida saida-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-de-tela
          path: saida-e2e

  emulador:
    name: sdk de verdade contra os emuladores (webkit e chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: npm install -g firebase-tools@15
      - run: firebase emulators:exec --only auth,firestore --project demo-luxus "python tests/emulador.py --motor chromium,webkit"

  regras:
    name: regras do firestore no emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g firebase-tools@15
      - run: firebase emulators:exec --only firestore --project demo-luxus "python3 tests/regras.py"
